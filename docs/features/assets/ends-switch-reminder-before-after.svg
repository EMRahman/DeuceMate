<svg xmlns="http://www.w3.org/2000/svg" width="900" height="498" viewBox="0 0 900 498"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="court" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3866D1"/><stop offset="1" stop-color="#244299"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="498" rx="10" fill="#14171c"/>

  <!-- Header -->
  <text x="32" y="30" font-size="15" font-weight="600" fill="#e6edf3">DeuceMate · live-match screen, right after tapping OK on the set-complete changeover popup</text>
  <text x="32" y="48" font-size="11.5" fill="#8b949e">Drawn 1:1 at 45 mm (198×242 pt), restyled from docs/screenshots/04-watch-scoreboard.png.</text>
  <text x="32" y="64" font-size="11.5" fill="#8b949e">Set 1 just finished 6–1 (odd total games) — ends switch before set 2's first point.</text>

  <!-- ── Section labels ─────────────────────────────────────────── -->
  <text x="48" y="91" font-size="12" font-weight="700" fill="#8b949e" letter-spacing="0.6">TODAY</text>
  <text x="112" y="91" font-size="11.5" fill="#6e7681">· nothing left once OK is tapped</text>
  <text x="310" y="91" font-size="12" font-weight="700" fill="#40CCB5" letter-spacing="0.6">PROPOSED</text>
  <text x="392" y="91" font-size="11.5" fill="#6e7681">· sticky until the first point</text>

  <!-- ══════════════════════════ TODAY watch ══════════════════════════ -->
  <rect x="48" y="98" width="222" height="266" rx="50" fill="#2a2f38"/>
  <rect x="60" y="110" width="198" height="242" rx="40" fill="#000"/>
  <g transform="translate(60,110)">
    <!-- status row: close button + workout time -->
    <circle cx="24" cy="20" r="14" fill="#242830"/>
    <path d="M18,14 L30,26 M30,14 L18,26" stroke="#e6edf3" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="150" cy="18" r="3.5" fill="#34c759"/>
    <text x="188" y="23" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="end">13:58</text>

    <!-- score card: Me row -->
    <rect x="4" y="40" width="190" height="36" rx="10" fill="#182219"/>
    <text x="20" y="63" font-size="9" text-anchor="middle">🎾</text>
    <text x="34" y="63" font-size="13" font-weight="700" fill="#e6edf3">Me</text>
    <rect x="78" y="46" width="34" height="24" rx="7" fill="#3a4250"/>
    <text x="95" y="63" font-size="12.5" font-weight="700" fill="#c9d1d9" text-anchor="middle">6</text>
    <rect x="118" y="46" width="34" height="24" rx="7" fill="#34c759"/>
    <text x="135" y="63" font-size="12.5" font-weight="700" fill="#06280f" text-anchor="middle">0</text>
    <rect x="158" y="46" width="34" height="24" rx="7" fill="#34c759"/>
    <text x="175" y="63" font-size="12.5" font-weight="700" fill="#06280f" text-anchor="middle">0</text>

    <!-- score card: Op row -->
    <rect x="4" y="80" width="190" height="36" rx="10" fill="#141c2c"/>
    <circle cx="20" cy="98" r="6.5" fill="#242830"/>
    <text x="34" y="103" font-size="13" font-weight="700" fill="#e6edf3">Op</text>
    <rect x="78" y="86" width="34" height="24" rx="7" fill="#3a4250"/>
    <text x="95" y="103" font-size="12.5" font-weight="700" fill="#c9d1d9" text-anchor="middle">1</text>
    <rect x="118" y="86" width="34" height="24" rx="7" fill="#0a84ff"/>
    <text x="135" y="103" font-size="12.5" font-weight="700" fill="#eaf3ff" text-anchor="middle">0</text>
    <rect x="158" y="86" width="34" height="24" rx="7" fill="#0a84ff"/>
    <text x="175" y="103" font-size="12.5" font-weight="700" fill="#eaf3ff" text-anchor="middle">0</text>

    <!-- momentum strip -->
    <rect x="4" y="126" width="190" height="16" rx="8" fill="#0d0f13"/>
    <g fill-opacity="0.9">
      <rect x="12" y="131.5" width="16" height="5" rx="2.5" fill="#0a84ff"/><rect x="32" y="131.5" width="16" height="5" rx="2.5" fill="#0a84ff"/>
      <rect x="52" y="131.5" width="16" height="5" rx="2.5" fill="#34c759"/><rect x="72" y="131.5" width="16" height="5" rx="2.5" fill="#34c759"/>
      <rect x="92" y="131.5" width="16" height="5" rx="2.5" fill="#34c759"/><rect x="112" y="131.5" width="16" height="5" rx="2.5" fill="#0a84ff"/>
      <rect x="132" y="131.5" width="16" height="5" rx="2.5" fill="#34c759"/><rect x="152" y="131.5" width="16" height="5" rx="2.5" fill="#34c759"/>
      <rect x="172" y="131.5" width="16" height="5" rx="2.5" fill="#0a84ff"/>
    </g>

    <!-- gap where the reminder would be — nothing is drawn here today -->

    <!-- court + HR row -->
    <rect x="4" y="160" width="122" height="56" rx="12" fill="url(#court)"/>
    <circle cx="30" cy="176" r="6" fill="#f6c744"/>
    <line x1="18" y1="192" x2="112" y2="192" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.4"/>
    <circle cx="100" cy="200" r="6" fill="#bcd4ff"/>
    <rect x="132" y="160" width="62" height="56" rx="12" fill="#000" stroke="#34c759" stroke-width="1.3"/>
    <text x="163" y="182" font-size="13" text-anchor="middle">♥</text>
    <text x="163" y="200" font-size="13" font-weight="700" fill="#34c759" text-anchor="middle">71</text>
    <text x="163" y="211" font-size="8" fill="#8b949e" text-anchor="middle">BPM</text>

    <text x="97" y="232" font-size="10" fill="#8b949e" text-anchor="middle">🔥 26 kcal  ·  ⏱ 3m 42s</text>
  </g>

  <text x="48" y="390" font-size="11.5" fill="#8b949e">No trace that a changeover just happened —</text>
  <text x="48" y="406" font-size="11.5" fill="#8b949e">the only way to check is to undo a point and</text>
  <text x="48" y="422" font-size="11.5" fill="#8b949e">re-trigger the popup, then redo the point.</text>

  <!-- ══════════════════════════ PROPOSED watch ══════════════════════════ -->
  <rect x="310" y="98" width="222" height="266" rx="50" fill="#2a2f38"/>
  <rect x="322" y="110" width="198" height="242" rx="40" fill="#000"/>
  <g transform="translate(322,110)">
    <circle cx="24" cy="20" r="14" fill="#242830"/>
    <path d="M18,14 L30,26 M30,14 L18,26" stroke="#e6edf3" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="150" cy="18" r="3.5" fill="#34c759"/>
    <text x="188" y="23" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="end">13:58</text>

    <rect x="4" y="40" width="190" height="36" rx="10" fill="#182219"/>
    <text x="20" y="63" font-size="9" text-anchor="middle">🎾</text>
    <text x="34" y="63" font-size="13" font-weight="700" fill="#e6edf3">Me</text>
    <rect x="78" y="46" width="34" height="24" rx="7" fill="#3a4250"/>
    <text x="95" y="63" font-size="12.5" font-weight="700" fill="#c9d1d9" text-anchor="middle">6</text>
    <rect x="118" y="46" width="34" height="24" rx="7" fill="#34c759"/>
    <text x="135" y="63" font-size="12.5" font-weight="700" fill="#06280f" text-anchor="middle">0</text>
    <rect x="158" y="46" width="34" height="24" rx="7" fill="#34c759"/>
    <text x="175" y="63" font-size="12.5" font-weight="700" fill="#06280f" text-anchor="middle">0</text>

    <rect x="4" y="80" width="190" height="36" rx="10" fill="#141c2c"/>
    <circle cx="20" cy="98" r="6.5" fill="#242830"/>
    <text x="34" y="103" font-size="13" font-weight="700" fill="#e6edf3">Op</text>
    <rect x="78" y="86" width="34" height="24" rx="7" fill="#3a4250"/>
    <text x="95" y="103" font-size="12.5" font-weight="700" fill="#c9d1d9" text-anchor="middle">1</text>
    <rect x="118" y="86" width="34" height="24" rx="7" fill="#0a84ff"/>
    <text x="135" y="103" font-size="12.5" font-weight="700" fill="#eaf3ff" text-anchor="middle">0</text>
    <rect x="158" y="86" width="34" height="24" rx="7" fill="#0a84ff"/>
    <text x="175" y="103" font-size="12.5" font-weight="700" fill="#eaf3ff" text-anchor="middle">0</text>

    <rect x="4" y="126" width="190" height="16" rx="8" fill="#0d0f13"/>
    <g fill-opacity="0.9">
      <rect x="12" y="131.5" width="16" height="5" rx="2.5" fill="#0a84ff"/><rect x="32" y="131.5" width="16" height="5" rx="2.5" fill="#0a84ff"/>
      <rect x="52" y="131.5" width="16" height="5" rx="2.5" fill="#34c759"/><rect x="72" y="131.5" width="16" height="5" rx="2.5" fill="#34c759"/>
      <rect x="92" y="131.5" width="16" height="5" rx="2.5" fill="#34c759"/><rect x="112" y="131.5" width="16" height="5" rx="2.5" fill="#0a84ff"/>
      <rect x="132" y="131.5" width="16" height="5" rx="2.5" fill="#34c759"/><rect x="152" y="131.5" width="16" height="5" rx="2.5" fill="#34c759"/>
      <rect x="172" y="131.5" width="16" height="5" rx="2.5" fill="#0a84ff"/>
    </g>

    <!-- new: ends-switch reminder banner, inserted right after the momentum strip -->
    <rect x="4" y="150" width="190" height="22" rx="8" fill="#ff9f0a" fill-opacity="0.16" stroke="#ff9f0a" stroke-opacity="0.55" stroke-width="1.2"/>
    <text x="99" y="165" font-size="11.5" font-weight="700" fill="#ff9f0a" text-anchor="middle">🔁 Switch ends</text>

    <!-- court + HR row, shifted down to make room -->
    <rect x="4" y="184" width="122" height="56" rx="12" fill="url(#court)"/>
    <circle cx="30" cy="200" r="6" fill="#f6c744"/>
    <line x1="18" y1="216" x2="112" y2="216" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.4"/>
    <circle cx="100" cy="224" r="6" fill="#bcd4ff"/>
    <rect x="132" y="184" width="62" height="56" rx="12" fill="#000" stroke="#34c759" stroke-width="1.3"/>
    <text x="163" y="206" font-size="13" text-anchor="middle">♥</text>
    <text x="163" y="224" font-size="13" font-weight="700" fill="#34c759" text-anchor="middle">71</text>
    <text x="163" y="235" font-size="8" fill="#8b949e" text-anchor="middle">BPM</text>
  </g>

  <!-- ── Leaders + annotations ──────────────────────────────────── -->
  <g stroke="#4b5563" stroke-width="1" fill="none">
    <path d="M517,260 L546,260 L562,202"/>
  </g>
  <g fill="#40CCB5">
    <circle cx="517" cy="260" r="2.2"/>
  </g>

  <text x="564" y="192" font-size="12.5" font-weight="700" fill="#e6edf3">Sticky, not modal</text>
  <text x="564" y="210" font-size="11.5" fill="#8b949e">Survives the OK tap, and states the</text>
  <text x="564" y="226" font-size="11.5" fill="#8b949e">outcome either way — never silent.</text>
  <text x="564" y="242" font-size="11.5" fill="#6e7681">Never blocks swipe-scoring.</text>

  <text x="564" y="274" font-size="12.5" font-weight="700" fill="#e6edf3">Clears itself</text>
  <text x="564" y="292" font-size="11.5" fill="#8b949e">Disappears the instant the first</text>
  <text x="564" y="308" font-size="11.5" fill="#8b949e">point of the new set is scored —</text>
  <text x="564" y="324" font-size="11.5" fill="#6e7681">pure derivation, no undo needed.</text>

  <text x="564" y="356" font-size="12.5" font-weight="700" fill="#e6edf3">In scope: set boundaries only</text>
  <text x="564" y="373" font-size="11" fill="#8b949e">Not the in-set odd/even-game changeover,</text>
  <text x="564" y="388" font-size="11" fill="#8b949e">a tiebreak's six-point changeover, or the</text>
  <text x="564" y="403" font-size="11" fill="#6e7681">run-up to a match-deciding tiebreak set.</text>

  <!-- ── Footer band ────────────────────────────────────────────── -->
  <line x1="32" y1="432" x2="868" y2="432" stroke="#242a33" stroke-width="1"/>
  <text x="32" y="456" font-size="11" fill="#6e7681">Both panels: OK has already been tapped on the changeover popup; about to serve set 2's first point.</text>
  <text x="32" y="474" font-size="11" fill="#6e7681">Diagram, not a screenshot — restyled from docs/screenshots/04-watch-scoreboard.png.</text>
</svg>
