  <text x="584" y="206" font-size="12.5" fill="#e6edf3" font-weight="700">Same 15 pt slot, zero reflow</text>
  <text x="584" y="224" font-size="11.5" fill="#8b949e">Drawn at the momentum strip's exact</text>
  <text x="584" y="240" font-size="11.5" fill="#8b949e">height, so nothing below it moves by</text>
  <text x="584" y="256" font-size="11.5" fill="#6e7681">a single point on any watch size.</text>
  <text x="584" y="288" font-size="12.5" fill="#e6edf3" font-weight="700">Sticky, not modal</text>
  <text x="584" y="306" font-size="11.5" fill="#8b949e">Survives the OK tap and states the</text>
  <text x="584" y="322" font-size="11.5" fill="#8b949e">outcome either way — switch or stay,</text>
  <text x="584" y="338" font-size="11.5" fill="#6e7681">never silent. Never blocks scoring.</text>
  <text x="584" y="370" font-size="12.5" fill="#e6edf3" font-weight="700">Clears itself</text>
  <text x="584" y="388" font-size="11.5" fill="#8b949e">The strip returns the instant the new</text>
  <text x="584" y="404" font-size="11.5" fill="#8b949e">set's first point is scored — until then</text>
  <text x="584" y="420" font-size="11.5" fill="#6e7681">it only shows the old set's tail.</text>
