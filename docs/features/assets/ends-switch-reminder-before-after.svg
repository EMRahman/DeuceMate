<svg xmlns="http://www.w3.org/2000/svg" width="900" height="486" viewBox="0 0 900 486"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#40CCB5"/><stop offset="1" stop-color="#1485EB"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="486" rx="10" fill="#14171c"/>

  <!-- Header -->
  <text x="32" y="32" font-size="15" font-weight="600" fill="#e6edf3">DeuceMate · live-match screen, right after tapping OK on the set-complete changeover popup</text>
  <text x="32" y="51" font-size="11.5" fill="#8b949e">Drawn 1:1 at 45 mm (198 × 242 pt). Set 1 just finished 6–1 (odd total games) — ends switch before the next set's first point.</text>

  <!-- ── Section labels ─────────────────────────────────────────── -->
  <text x="48" y="79" font-size="12" font-weight="700" fill="#8b949e" letter-spacing="0.6">TODAY</text>
  <text x="112" y="79" font-size="11.5" fill="#6e7681">· nothing left once OK is tapped</text>
  <text x="310" y="79" font-size="12" font-weight="700" fill="#40CCB5" letter-spacing="0.6">PROPOSED</text>
  <text x="392" y="79" font-size="11.5" fill="#6e7681">· sticky until the first point</text>

  <!-- ── TODAY watch ────────────────────────────────────────────── -->
  <rect x="48" y="86" width="222" height="266" rx="50" fill="#2a2f38"/>
  <rect x="60" y="98" width="198" height="242" rx="40" fill="#000"/>

  <!-- current game score -->
  <text x="159" y="140" font-size="24" font-weight="700" fill="#e6edf3" text-anchor="middle">0 – 0</text>
  <text x="159" y="158" font-size="11" fill="#8b949e" text-anchor="middle">Sets  6-1 · 0-0   ·   Me to serve</text>

  <!-- momentum strip -->
  <rect x="76" y="170" width="166" height="15" rx="7" fill="#ffffff" fill-opacity="0.07"/>
  <g fill="#ffffff" fill-opacity="0.18">
    <rect x="84" y="175.5" width="14" height="4" rx="2"/><rect x="102" y="175.5" width="14" height="4" rx="2"/>
    <rect x="120" y="175.5" width="14" height="4" rx="2"/><rect x="138" y="175.5" width="14" height="4" rx="2"/>
    <rect x="156" y="175.5" width="14" height="4" rx="2"/><rect x="174" y="175.5" width="14" height="4" rx="2"/>
    <rect x="192" y="175.5" width="14" height="4" rx="2"/><rect x="210" y="175.5" width="14" height="4" rx="2"/>
  </g>

  <!-- empty space where the reminder would be — dashed placeholder -->
  <rect x="76" y="197" width="166" height="22" rx="8" fill="none" stroke="#3a4250" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="159" y="211.5" font-size="10" fill="#4b5563" text-anchor="middle">(nothing here)</text>

  <!-- court + heart rate row -->
  <circle cx="112" cy="252" r="20" fill="#ffffff" fill-opacity="0.06"/>
  <text x="112" y="257" font-size="14" text-anchor="middle">🎾</text>
  <rect x="150" y="236" width="92" height="32" rx="8" fill="#ffffff" fill-opacity="0.06"/>
  <text x="196" y="257" font-size="11" fill="#8b949e" text-anchor="middle">♥ 132 bpm</text>

  <text x="48" y="378" font-size="11.5" fill="#8b949e">No trace that a changeover just happened —</text>
  <text x="48" y="394" font-size="11.5" fill="#8b949e">the only way to check is to undo a point and</text>
  <text x="48" y="410" font-size="11.5" fill="#8b949e">re-trigger the popup, then redo the point.</text>

  <!-- ── PROPOSED watch ─────────────────────────────────────────── -->
  <rect x="310" y="86" width="222" height="266" rx="50" fill="#2a2f38"/>
  <rect x="322" y="98" width="198" height="242" rx="40" fill="#000"/>

  <text x="421" y="140" font-size="24" font-weight="700" fill="#e6edf3" text-anchor="middle">0 – 0</text>
  <text x="421" y="158" font-size="11" fill="#8b949e" text-anchor="middle">Sets  6-1 · 0-0   ·   Me to serve</text>

  <rect x="338" y="170" width="166" height="15" rx="7" fill="#ffffff" fill-opacity="0.07"/>
  <g fill="#ffffff" fill-opacity="0.18">
    <rect x="346" y="175.5" width="14" height="4" rx="2"/><rect x="364" y="175.5" width="14" height="4" rx="2"/>
    <rect x="382" y="175.5" width="14" height="4" rx="2"/><rect x="400" y="175.5" width="14" height="4" rx="2"/>
    <rect x="418" y="175.5" width="14" height="4" rx="2"/><rect x="436" y="175.5" width="14" height="4" rx="2"/>
    <rect x="454" y="175.5" width="14" height="4" rx="2"/><rect x="472" y="175.5" width="14" height="4" rx="2"/>
  </g>

  <!-- ends-switch reminder banner — "switch" state -->
  <rect x="338" y="197" width="166" height="22" rx="8" fill="#ff9f0a" fill-opacity="0.16" stroke="#ff9f0a" stroke-opacity="0.55" stroke-width="1"/>
  <text x="421" y="211.5" font-size="11" font-weight="700" fill="#ff9f0a" text-anchor="middle">🔁 Switch ends</text>

  <circle cx="374" cy="252" r="20" fill="#ffffff" fill-opacity="0.06"/>
  <text x="374" y="257" font-size="14" text-anchor="middle">🎾</text>
  <rect x="412" y="236" width="92" height="32" rx="8" fill="#ffffff" fill-opacity="0.06"/>
  <text x="458" y="257" font-size="11" fill="#8b949e" text-anchor="middle">♥ 132 bpm</text>

  <!-- ── Leaders + annotations ──────────────────────────────────── -->
  <g stroke="#4b5563" stroke-width="1" fill="none">
    <path d="M504,208 L540,208 L556,190"/>
  </g>
  <g fill="#40CCB5">
    <circle cx="504" cy="208" r="2.2"/>
  </g>

  <text x="564" y="180" font-size="12.5" font-weight="700" fill="#e6edf3">Sticky, not modal</text>
  <text x="564" y="198" font-size="11.5" fill="#8b949e">Survives the OK tap. Reads "🔁 Switch ends" or</text>
  <text x="564" y="214" font-size="11.5" fill="#8b949e">"📍 Same ends" — never silent either way.</text>
  <text x="564" y="230" font-size="11.5" fill="#6e7681">Never blocks swipe-scoring — score right through it.</text>

  <text x="564" y="262" font-size="12.5" font-weight="700" fill="#e6edf3">Clears itself</text>
  <text x="564" y="280" font-size="11.5" fill="#8b949e">Disappears the instant the first point of the new</text>
  <text x="564" y="296" font-size="11.5" fill="#8b949e">set is scored — pure derivation, no timer, no undo</text>
  <text x="564" y="312" font-size="11.5" fill="#6e7681">workaround needed to check twice.</text>

  <text x="564" y="344" font-size="12.5" font-weight="700" fill="#e6edf3">In scope: set boundaries only</text>
  <text x="564" y="362" font-size="11.5" fill="#8b949e">Not the in-set odd/even-game changeover, not a</text>
  <text x="564" y="378" font-size="11.5" fill="#8b949e">tiebreak's six-point changeover, not the run-up to a</text>
  <text x="564" y="394" font-size="11.5" fill="#6e7681">match-deciding super-tiebreak set. See §5.</text>

  <!-- ── Footer band ────────────────────────────────────────────── -->
  <line x1="32" y1="420" x2="868" y2="420" stroke="#242a33" stroke-width="1"/>
  <text x="32" y="444" font-size="11" fill="#6e7681">Both panels show the same moment: the user already tapped OK on the full-screen changeover popup and is about to serve the first point of set 2.</text>
  <text x="32" y="462" font-size="11" fill="#6e7681">Diagram, not a screenshot — schematic of DeuceMate Watch App/ContentView.swift's score screen.</text>
</svg>
