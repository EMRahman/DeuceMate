<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Courtside scoring: who does what</title>
  <desc id="d">The player wears the Apple Watch, which keeps the score. A coach or umpire holds the paired iPhone and scores. Every iPhone tap is sent to the Watch, which applies it and sends the saved score back to the iPhone.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a4a5c"/>
    </marker>
  </defs>
  <rect width="880" height="470" rx="18" fill="#f6f8f5"/>

  <!-- Court strip -->
  <rect x="24" y="24" width="832" height="40" rx="10" fill="#2f6b45"/>
  <text x="440" y="50" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">On court: the player just plays. Courtside: someone else does the scoring.</text>

  <!-- Player / Watch -->
  <rect x="40" y="96" width="270" height="250" rx="16" fill="#ffffff" stroke="#c9d3cc" stroke-width="1.5"/>
  <text x="175" y="128" text-anchor="middle" font-size="18" font-weight="700" fill="#1d2a22">Player</text>
  <text x="175" y="150" text-anchor="middle" font-size="14" fill="#55625a">wears the Apple Watch</text>
  <!-- watch drawing -->
  <rect x="135" y="166" width="80" height="96" rx="20" fill="#111" />
  <rect x="143" y="174" width="64" height="80" rx="14" fill="#1c1c1e"/>
  <text x="175" y="202" text-anchor="middle" font-size="13" font-weight="700" fill="#4cd27a">ME  30</text>
  <text x="175" y="224" text-anchor="middle" font-size="13" font-weight="700" fill="#5aa2ff">OPP 15</text>
  <rect x="217" y="196" width="6" height="18" rx="3" fill="#111"/>
  <text x="175" y="290" text-anchor="middle" font-size="14" fill="#1d2a22">Sees the score on the wrist</text>
  <text x="175" y="310" text-anchor="middle" font-size="14" fill="#1d2a22">Can still swipe or tap OK</text>
  <text x="175" y="330" text-anchor="middle" font-size="13" font-weight="600" fill="#2f6b45">Keeps the official score</text>

  <!-- Scorer / iPhone -->
  <rect x="570" y="96" width="270" height="250" rx="16" fill="#ffffff" stroke="#c9d3cc" stroke-width="1.5"/>
  <text x="705" y="128" text-anchor="middle" font-size="18" font-weight="700" fill="#1d2a22">Coach or umpire</text>
  <text x="705" y="150" text-anchor="middle" font-size="14" fill="#55625a">holds the player's paired iPhone</text>
  <!-- phone drawing, landscape -->
  <rect x="637" y="172" width="136" height="80" rx="14" fill="#111"/>
  <rect x="645" y="180" width="120" height="64" rx="8" fill="#121212"/>
  <text x="655" y="202" font-size="12" font-weight="700" fill="#4cd27a">ME</text>
  <text x="740" y="202" text-anchor="end" font-size="14" font-weight="800" fill="#4cd27a">30</text>
  <text x="655" y="230" font-size="12" font-weight="700" fill="#5aa2ff">OPP</text>
  <text x="740" y="230" text-anchor="end" font-size="14" font-weight="800" fill="#5aa2ff">15</text>
  <text x="705" y="290" text-anchor="middle" font-size="14" fill="#1d2a22">Swipes ↑ Me  ↓ Opp  ← Undo</text>
  <text x="705" y="310" text-anchor="middle" font-size="14" fill="#1d2a22">Tags points, taps changeover OK</text>
  <text x="705" y="330" text-anchor="middle" font-size="13" font-weight="600" fill="#8a5a00">Asks the Watch; never scores alone</text>

  <!-- Arrows -->
  <line x1="560" y1="200" x2="322" y2="200" stroke="#3a4a5c" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="440" y="166" text-anchor="middle" font-size="13" font-weight="600" fill="#1d2a22">1 · "Point to Me"</text>
  <text x="440" y="184" text-anchor="middle" font-size="12" fill="#55625a">or category · changeover OK · next server</text>

  <line x1="322" y1="250" x2="560" y2="250" stroke="#3a4a5c" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="440" y="238" text-anchor="middle" font-size="13" font-weight="600" fill="#1d2a22">2 · Saved score + any prompt</text>
  <text x="440" y="270" text-anchor="middle" font-size="12" fill="#55625a">the iPhone updates only from this reply</text>

  <!-- Footer rules -->
  <rect x="40" y="368" width="800" height="78" rx="12" fill="#eef2ee" stroke="#d6ded8"/>
  <text x="60" y="394" font-size="14" font-weight="700" fill="#1d2a22">Rules that keep the two screens identical</text>
  <text x="60" y="416" font-size="13" fill="#33403a">• The Watch applies every iPhone action with the same code as its own buttons, then saves and replies.</text>
  <text x="60" y="436" font-size="13" fill="#33403a">• One action at a time. Out of range? The iPhone says "Waiting for Watch" and sends nothing.</text>
</svg>
