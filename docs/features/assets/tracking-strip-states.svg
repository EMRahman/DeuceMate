<svg xmlns="http://www.w3.org/2000/svg" width="900" height="506" viewBox="0 0 900 506" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="900" height="506" rx="10" fill="#14171c"/>
<text x="32" y="34" font-size="15" font-weight="600" fill="#e6edf3">Tracking strip — every state it can be in</text>
<text x="32" y="53" font-size="11.5" fill="#8b949e">Drawn 1:1 at the real 166 pt content width. Resolved by <tspan font-style="italic">MatchTrackingStatus</tspan> in DeuceMateCore, unit-tested without a simulator.</text>
<line x1="32" y1="72" x2="868" y2="72" stroke="#242a33" stroke-width="1"/>
<rect x="32" y="82" width="836" height="56" rx="8" fill="#181c22"/>
<rect x="46.0" y="100" width="52.0" height="20" rx="6" fill="#34c759" fill-opacity="0.16" stroke="#34c759" stroke-opacity="0.45" stroke-width="1"/><g transform="translate(59.0,110.0)" stroke="#34c759" fill="none"><circle r="5.6" stroke-width="1.3"/><circle r="2.2" fill="#34c759" stroke="none"/></g><text x="81.0" y="113.6" font-size="10.5" font-weight="700" fill="#34c759" text-anchor="middle">On</text><rect x="103.0" y="100" width="52.0" height="20" rx="6" fill="#34c759" fill-opacity="0.16" stroke="#34c759" stroke-opacity="0.45" stroke-width="1"/><path transform="translate(116.0,110.0) scale(0.62)" fill="#34c759" d="M0,4.5 C-2,2.5 -7,-1 -7,-4 C-7,-6.3 -5.2,-7.6 -3.5,-7.6 C-1.8,-7.6 -0.6,-6.4 0,-5.3 C0.6,-6.4 1.8,-7.6 3.5,-7.6 C5.2,-7.6 7,-6.3 7,-4 C7,-1 2,2.5 0,4.5 Z"/><text x="138.0" y="113.6" font-size="10.5" font-weight="700" fill="#34c759" text-anchor="middle">On</text><rect x="160.0" y="100" width="52.0" height="20" rx="6" fill="#34c759" fill-opacity="0.16" stroke="#34c759" stroke-opacity="0.45" stroke-width="1"/><polyline transform="translate(173.0,110.0)" points="-6,0 -3.6,0 -2.2,-4.4 -0.4,4.4 1.4,-2.6 2.8,0 6,0" fill="none" stroke="#34c759" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="195.0" y="113.6" font-size="10.5" font-weight="700" fill="#34c759" text-anchor="middle">On</text>
<text x="240" y="101" font-size="12.5" font-weight="700" fill="#e6edf3">Everything records</text>
<text x="240" y="119" font-size="11.5" fill="#8b949e">Point outcomes, heart rate, steps and calories, and HR zones</text>
<text x="240" y="135" font-size="11.5" fill="#8b949e">against a calibrated max HR. The steady state.</text>
<rect x="32" y="144" width="836" height="56" rx="8" fill="#14171c"/>
<rect x="46.0" y="162" width="52.0" height="20" rx="6" fill="#8e8e93" fill-opacity="0.16" stroke="#8e8e93" stroke-opacity="0.45" stroke-width="1"/><g transform="translate(59.0,172.0)" stroke="#8e8e93" fill="none"><circle r="5.6" stroke-width="1.3"/><circle r="2.2" fill="#8e8e93" stroke="none"/></g><text x="81.0" y="175.6" font-size="10.5" font-weight="700" fill="#8e8e93" text-anchor="middle">Off</text><rect x="103.0" y="162" width="52.0" height="20" rx="6" fill="#34c759" fill-opacity="0.16" stroke="#34c759" stroke-opacity="0.45" stroke-width="1"/><path transform="translate(116.0,172.0) scale(0.62)" fill="#34c759" d="M0,4.5 C-2,2.5 -7,-1 -7,-4 C-7,-6.3 -5.2,-7.6 -3.5,-7.6 C-1.8,-7.6 -0.6,-6.4 0,-5.3 C0.6,-6.4 1.8,-7.6 3.5,-7.6 C5.2,-7.6 7,-6.3 7,-4 C7,-1 2,2.5 0,4.5 Z"/><text x="138.0" y="175.6" font-size="10.5" font-weight="700" fill="#34c759" text-anchor="middle">On</text><rect x="160.0" y="162" width="52.0" height="20" rx="6" fill="#34c759" fill-opacity="0.16" stroke="#34c759" stroke-opacity="0.45" stroke-width="1"/><polyline transform="translate(173.0,172.0)" points="-6,0 -3.6,0 -2.2,-4.4 -0.4,4.4 1.4,-2.6 2.8,0 6,0" fill="none" stroke="#34c759" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="195.0" y="175.6" font-size="10.5" font-weight="700" fill="#34c759" text-anchor="middle">On</text>
<text x="240" y="163" font-size="12.5" font-weight="700" fill="#e6edf3">Point tracking off</text>
<text x="240" y="181" font-size="11.5" fill="#8b949e">No shot or outcome stats for this match — and there is no</text>
<text x="240" y="197" font-size="11.5" fill="#8b949e">post-hoc categorisation path, so they can never be added.</text>
<rect x="32" y="206" width="836" height="56" rx="8" fill="#181c22"/>
<rect x="46.0" y="224" width="80.5" height="20" rx="6" fill="#34c759" fill-opacity="0.16" stroke="#34c759" stroke-opacity="0.45" stroke-width="1"/><g transform="translate(59.0,234.0)" stroke="#34c759" fill="none"><circle r="5.6" stroke-width="1.3"/><circle r="2.2" fill="#34c759" stroke="none"/></g><text x="95.25" y="237.6" font-size="10.5" font-weight="700" fill="#34c759" text-anchor="middle">On</text><rect x="131.5" y="224" width="80.5" height="20" rx="6" fill="#8e8e93" fill-opacity="0.16" stroke="#8e8e93" stroke-opacity="0.45" stroke-width="1"/><path transform="translate(144.5,234.0) scale(0.62)" fill="#8e8e93" d="M0,4.5 C-2,2.5 -7,-1 -7,-4 C-7,-6.3 -5.2,-7.6 -3.5,-7.6 C-1.8,-7.6 -0.6,-6.4 0,-5.3 C0.6,-6.4 1.8,-7.6 3.5,-7.6 C5.2,-7.6 7,-6.3 7,-4 C7,-1 2,2.5 0,4.5 Z"/><text x="180.75" y="237.6" font-size="10.5" font-weight="700" fill="#8e8e93" text-anchor="middle">Off</text>
<text x="240" y="225" font-size="12.5" font-weight="700" fill="#e6edf3">Health denied  ·  Pulse chip suppressed  (OQ-1)</text>
<text x="240" y="243" font-size="11.5" fill="#8b949e">No heart rate, steps or calories — and Pulse Coach cannot run</text>
<text x="240" y="259" font-size="11.5" fill="#8b949e">either. One cause, one chip; the Health detail carries both.</text>
<rect x="32" y="268" width="836" height="56" rx="8" fill="#14171c"/>
<rect x="46.0" y="286" width="52.0" height="20" rx="6" fill="#34c759" fill-opacity="0.16" stroke="#34c759" stroke-opacity="0.45" stroke-width="1"/><g transform="translate(59.0,296.0)" stroke="#34c759" fill="none"><circle r="5.6" stroke-width="1.3"/><circle r="2.2" fill="#34c759" stroke="none"/></g><text x="81.0" y="299.6" font-size="10.5" font-weight="700" fill="#34c759" text-anchor="middle">On</text><rect x="103.0" y="286" width="52.0" height="20" rx="6" fill="#ff9f0a" fill-opacity="0.16" stroke="#ff9f0a" stroke-opacity="0.45" stroke-width="1"/><path transform="translate(116.0,296.0) scale(0.62)" fill="#ff9f0a" d="M0,4.5 C-2,2.5 -7,-1 -7,-4 C-7,-6.3 -5.2,-7.6 -3.5,-7.6 C-1.8,-7.6 -0.6,-6.4 0,-5.3 C0.6,-6.4 1.8,-7.6 3.5,-7.6 C5.2,-7.6 7,-6.3 7,-4 C7,-1 2,2.5 0,4.5 Z"/><text x="138.0" y="299.6" font-size="10.5" font-weight="700" fill="#ff9f0a" text-anchor="middle">Ask</text><rect x="160.0" y="286" width="52.0" height="20" rx="6" fill="#34c759" fill-opacity="0.16" stroke="#34c759" stroke-opacity="0.45" stroke-width="1"/><polyline transform="translate(173.0,296.0)" points="-6,0 -3.6,0 -2.2,-4.4 -0.4,4.4 1.4,-2.6 2.8,0 6,0" fill="none" stroke="#34c759" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="195.0" y="299.6" font-size="10.5" font-weight="700" fill="#34c759" text-anchor="middle">On</text>
<text x="240" y="287" font-size="12.5" font-weight="700" fill="#e6edf3">Health permission not yet answered</text>
<text x="240" y="305" font-size="11.5" fill="#8b949e">DeuceMate will ask when the match starts. Distinct from denied:</text>
<text x="240" y="321" font-size="11.5" fill="#8b949e">a prompt fixes this, iPhone Settings fixes that.</text>
<rect x="32" y="330" width="836" height="56" rx="8" fill="#181c22"/>
<rect x="46.0" y="348" width="52.0" height="20" rx="6" fill="#34c759" fill-opacity="0.16" stroke="#34c759" stroke-opacity="0.45" stroke-width="1"/><g transform="translate(59.0,358.0)" stroke="#34c759" fill="none"><circle r="5.6" stroke-width="1.3"/><circle r="2.2" fill="#34c759" stroke="none"/></g><text x="81.0" y="361.6" font-size="10.5" font-weight="700" fill="#34c759" text-anchor="middle">On</text><rect x="103.0" y="348" width="52.0" height="20" rx="6" fill="#34c759" fill-opacity="0.16" stroke="#34c759" stroke-opacity="0.45" stroke-width="1"/><path transform="translate(116.0,358.0) scale(0.62)" fill="#34c759" d="M0,4.5 C-2,2.5 -7,-1 -7,-4 C-7,-6.3 -5.2,-7.6 -3.5,-7.6 C-1.8,-7.6 -0.6,-6.4 0,-5.3 C0.6,-6.4 1.8,-7.6 3.5,-7.6 C5.2,-7.6 7,-6.3 7,-4 C7,-1 2,2.5 0,4.5 Z"/><text x="138.0" y="361.6" font-size="10.5" font-weight="700" fill="#34c759" text-anchor="middle">On</text><rect x="160.0" y="348" width="52.0" height="20" rx="6" fill="#ff9f0a" fill-opacity="0.16" stroke="#ff9f0a" stroke-opacity="0.45" stroke-width="1"/><polyline transform="translate(173.0,358.0)" points="-6,0 -3.6,0 -2.2,-4.4 -0.4,4.4 1.4,-2.6 2.8,0 6,0" fill="none" stroke="#ff9f0a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="195.0" y="361.6" font-size="10.5" font-weight="700" fill="#ff9f0a" text-anchor="middle">Est.</text>
<text x="240" y="349" font-size="12.5" font-weight="700" fill="#e6edf3">Pulse Coach on the 190 bpm default</text>
<text x="240" y="367" font-size="11.5" fill="#8b949e">Amber, not grey — zones are derived at display time, so setting a</text>
<text x="240" y="383" font-size="11.5" fill="#8b949e">birth year later recomputes this match and every past one.</text>
<rect x="32" y="392" width="836" height="56" rx="8" fill="#14171c"/>
<rect x="46.0" y="410" width="52.0" height="20" rx="6" fill="#8e8e93" fill-opacity="0.16" stroke="#8e8e93" stroke-opacity="0.45" stroke-width="1"/><g transform="translate(59.0,420.0)" stroke="#8e8e93" fill="none"><circle r="5.6" stroke-width="1.3"/><circle r="2.2" fill="#8e8e93" stroke="none"/></g><text x="81.0" y="423.6" font-size="10.5" font-weight="700" fill="#8e8e93" text-anchor="middle">—</text><rect x="103.0" y="410" width="52.0" height="20" rx="6" fill="#34c759" fill-opacity="0.16" stroke="#34c759" stroke-opacity="0.45" stroke-width="1"/><path transform="translate(116.0,420.0) scale(0.62)" fill="#34c759" d="M0,4.5 C-2,2.5 -7,-1 -7,-4 C-7,-6.3 -5.2,-7.6 -3.5,-7.6 C-1.8,-7.6 -0.6,-6.4 0,-5.3 C0.6,-6.4 1.8,-7.6 3.5,-7.6 C5.2,-7.6 7,-6.3 7,-4 C7,-1 2,2.5 0,4.5 Z"/><text x="138.0" y="423.6" font-size="10.5" font-weight="700" fill="#34c759" text-anchor="middle">On</text><rect x="160.0" y="410" width="52.0" height="20" rx="6" fill="#34c759" fill-opacity="0.16" stroke="#34c759" stroke-opacity="0.45" stroke-width="1"/><polyline transform="translate(173.0,420.0)" points="-6,0 -3.6,0 -2.2,-4.4 -0.4,4.4 1.4,-2.6 2.8,0 6,0" fill="none" stroke="#34c759" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="195.0" y="423.6" font-size="10.5" font-weight="700" fill="#34c759" text-anchor="middle">On</text>
<text x="240" y="411" font-size="12.5" font-weight="700" fill="#e6edf3">Format suppresses point tracking</text>
<text x="240" y="429" font-size="11.5" fill="#8b949e">MatchFormat.perpetualPoints sets disablesPointTracking, which wins</text>
<text x="240" y="445" font-size="11.5" fill="#8b949e">over the user's setting. Say “—”, never “On”. (§3.3 — why B ships first.)</text>
<line x1="32" y1="460" x2="868" y2="460" stroke="#242a33" stroke-width="1"/>
<text x="32" y="484" font-size="11" fill="#6e7681">The watch Settings sheet always shows all three, full width, with the explanatory detail line — so the complete picture is never more than one tap away.</text>
</svg>
