<svg xmlns="http://www.w3.org/2000/svg" width="900" height="486" viewBox="0 0 900 486"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#40CCB5"/><stop offset="1" stop-color="#1485EB"/>
    </linearGradient>
    <linearGradient id="opp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3866D1"/><stop offset="1" stop-color="#244299"/>
    </linearGradient>
    <linearGradient id="guide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#455269"/><stop offset="1" stop-color="#242E40"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="486" rx="10" fill="#14171c"/>

  <!-- Header -->
  <text x="32" y="32" font-size="15" font-weight="600" fill="#e6edf3">DeuceMate · Apple Watch start screen</text>
  <text x="32" y="51" font-size="11.5" fill="#8b949e">Drawn 1:1 at 45 mm (198 × 242 pt). Classic theme gradients. No match in progress; past matches exist.</text>

  <!-- ── Section labels ─────────────────────────────────────────── -->
  <text x="48" y="79" font-size="12" font-weight="700" fill="#8b949e" letter-spacing="0.6">TODAY</text>
  <text x="112" y="79" font-size="11.5" fill="#6e7681">· 5 taps to the first point</text>
  <text x="310" y="79" font-size="12" font-weight="700" fill="#40CCB5" letter-spacing="0.6">PROPOSED</text>
  <text x="392" y="79" font-size="11.5" fill="#6e7681">· 3 taps</text>

  <!-- ── TODAY watch ────────────────────────────────────────────── -->
  <rect x="48" y="86" width="222" height="266" rx="50" fill="#2a2f38"/>
  <rect x="60" y="98" width="198" height="242" rx="40" fill="#000"/>

  <rect x="76" y="143" width="166" height="44" rx="12" fill="url(#primary)"/>
  <text x="159" y="170" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">▶  Start Match</text>

  <rect x="76" y="197" width="166" height="44" rx="12" fill="url(#opp)"/>
  <text x="159" y="224" font-size="13.5" font-weight="500" fill="#fff" text-anchor="middle">Past Matches</text>

  <rect x="76" y="251" width="79" height="44" rx="12" fill="url(#guide)"/>
  <text x="115.5" y="279" font-size="16" fill="#fff" text-anchor="middle">⚙</text>
  <rect x="163" y="251" width="79" height="44" rx="12" fill="url(#guide)"/>
  <text x="202.5" y="279" font-size="15" fill="#fff" text-anchor="middle">📖</text>

  <text x="48" y="376" font-size="11.5" fill="#8b949e">Nothing here states whether the match will</text>
  <text x="48" y="392" font-size="11.5" fill="#8b949e">record points, heart rate, or usable HR zones —</text>
  <text x="48" y="408" font-size="11.5" fill="#8b949e">and the format is asked again on the next screen.</text>

  <!-- ── PROPOSED watch ─────────────────────────────────────────── -->
  <rect x="310" y="86" width="222" height="266" rx="50" fill="#2a2f38"/>
  <rect x="322" y="98" width="198" height="242" rx="40" fill="#000"/>

  <rect x="338" y="137" width="166" height="44" rx="12" fill="url(#primary)"/>
  <text x="421" y="164" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">▶  Start Match</text>

  <!-- pre-match card -->
  <rect x="338" y="191" width="166" height="58" rx="12" fill="#1b2029" stroke="#333c48" stroke-width="1"/>
  <text x="348" y="211" font-size="12" font-weight="500" fill="#e6edf3">Singles · Best of 3</text>
  <path d="M489,208 L493,212 L497,208" fill="none" stroke="#8b949e" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="344" y1="218" x2="498" y2="218" stroke="#2a323d" stroke-width="1"/>

  <!-- chip 1 — points: On (green) -->
  <rect x="344" y="224" width="48" height="20" rx="6" fill="#34c759" fill-opacity="0.16" stroke="#34c759" stroke-opacity="0.45" stroke-width="1"/>
  <g transform="translate(356,234)" stroke="#34c759" fill="none">
    <circle r="5.6" stroke-width="1.3"/><circle r="2.2" fill="#34c759" stroke="none"/>
  </g>
  <text x="375" y="238" font-size="10.5" font-weight="700" fill="#34c759" text-anchor="middle">On</text>

  <!-- chip 2 — health: Off (grey) -->
  <rect x="397" y="224" width="48" height="20" rx="6" fill="#8e8e93" fill-opacity="0.16" stroke="#8e8e93" stroke-opacity="0.45" stroke-width="1"/>
  <path transform="translate(409,234) scale(0.62)" fill="#8e8e93"
        d="M0,4.5 C-2,2.5 -7,-1 -7,-4 C-7,-6.3 -5.2,-7.6 -3.5,-7.6 C-1.8,-7.6 -0.6,-6.4 0,-5.3 C0.6,-6.4 1.8,-7.6 3.5,-7.6 C5.2,-7.6 7,-6.3 7,-4 C7,-1 2,2.5 0,4.5 Z"/>
  <text x="428" y="238" font-size="10.5" font-weight="700" fill="#8e8e93" text-anchor="middle">Off</text>

  <!-- chip 3 — pulse: Est. (amber) -->
  <rect x="450" y="224" width="48" height="20" rx="6" fill="#ff9f0a" fill-opacity="0.16" stroke="#ff9f0a" stroke-opacity="0.45" stroke-width="1"/>
  <polyline transform="translate(462,234)" points="-6,0 -3.6,0 -2.2,-4.4 -0.4,4.4 1.4,-2.6 2.8,0 6,0"
            fill="none" stroke="#ff9f0a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="481" y="238" font-size="10.5" font-weight="700" fill="#ff9f0a" text-anchor="middle">Est.</text>

  <!-- icon row: Past Matches (clock.arrow.circlepath, leftmost) / Settings / Guide -->
  <rect x="338" y="257" width="52" height="44" rx="12" fill="url(#opp)"/>
  <g transform="translate(364,280)" fill="none" stroke="#fff" stroke-width="1.7"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M-1.6,-6.2 A6.2,6.2 0 1 1 -5.6,-2.6"/>
    <path d="M-1.6,-6.2 L0.8,-5.3"/>
    <path d="M-1.6,-6.2 L0.1,-8.2"/>
    <path d="M0,-3.4 L0,0 L2.6,1.5"/>
  </g>
  <rect x="395" y="257" width="52" height="44" rx="12" fill="url(#guide)"/>
  <text x="421" y="285" font-size="16" fill="#fff" text-anchor="middle">⚙</text>
  <rect x="452" y="257" width="52" height="44" rx="12" fill="url(#guide)"/>
  <text x="478" y="285" font-size="14" fill="#fff" text-anchor="middle">📖</text>

  <!-- ── Leaders + annotations ──────────────────────────────────── -->
  <g stroke="#4b5563" stroke-width="1" fill="none">
    <path d="M504,205 L540,205 L556,190"/>
    <path d="M504,234 L534,234 L556,258"/>
    <path d="M504,279 L524,279 L556,330"/>
  </g>
  <g fill="#40CCB5">
    <circle cx="504" cy="205" r="2.2"/><circle cx="504" cy="234" r="2.2"/><circle cx="504" cy="279" r="2.2"/>
  </g>

  <text x="564" y="180" font-size="12.5" font-weight="700" fill="#e6edf3">Remembered match setup</text>
  <text x="564" y="198" font-size="11.5" fill="#8b949e">Whatever the last match used — no configuration.</text>
  <text x="564" y="214" font-size="11.5" fill="#8b949e">Tap → format sheet + Singles/Doubles.</text>
  <text x="564" y="230" font-size="11.5" fill="#6e7681">Safe to remember only because it is displayed.</text>

  <text x="564" y="262" font-size="12.5" font-weight="700" fill="#e6edf3">What this match will record</text>
  <text x="564" y="280" font-size="11.5" fill="#8b949e">Point tracking · Health · Pulse Coach.</text>
  <text x="564" y="296" font-size="11.5" fill="#8b949e">Tap → Settings. One line, icon + state.</text>
  <text x="564" y="312" font-size="11.5" fill="#6e7681">Format-aware: Perpetual Points shows “—”, not “On”.</text>

  <text x="564" y="344" font-size="12.5" font-weight="700" fill="#e6edf3">Past Matches → history icon, leftmost</text>
  <text x="564" y="362" font-size="11.5" fill="#8b949e">clock.arrow.circlepath, and it keeps its blue — it is</text>
  <text x="564" y="378" font-size="11.5" fill="#8b949e">the most-used of the three. Frees 54 pt, so the</text>
  <text x="564" y="394" font-size="11.5" fill="#8b949e">68 pt card fits without scrolling — even on 41 mm.</text>

  <!-- ── Footer band ────────────────────────────────────────────── -->
  <line x1="32" y1="420" x2="868" y2="420" stroke="#242a33" stroke-width="1"/>

  <g>
    <circle cx="40" cy="443" r="4.5" fill="#34c759"/>
    <text x="51" y="447" font-size="11" fill="#8b949e">records</text>
    <circle cx="118" cy="443" r="4.5" fill="#ff9f0a"/>
    <text x="129" y="447" font-size="11" fill="#8b949e">records, degraded — fixable later</text>
    <circle cx="317" cy="443" r="4.5" fill="#8e8e93"/>
    <text x="328" y="447" font-size="11" fill="#8b949e">does not record — cannot be fixed later</text>
  </g>
  <text x="32" y="470" font-size="11" fill="#6e7681">Height budget: 44 + 10 + 58 + 10 + 44 = 166 pt of content + 32 pt padding = 198 pt — fits 45 mm (242 pt) and 41 mm (215 pt) without scrolling.</text>
</svg>
