  <rect x="62.0" y="270.0" width="150.0" height="50.5" rx="8" fill="#2b436f" stroke="#4f74b8" stroke-width="1"/>
  <text x="137.0" y="299.25" font-size="10.5" fill="#c9d1d9" font-weight="600" text-anchor="middle">court + heart rate</text>
  <rect x="62.0" y="322.5" width="150.0" height="9.0" rx="8" fill="#1a1d22" stroke="#3a4250" stroke-width="1"/>
  <text x="137.0" y="329.75" font-size="10.5" fill="#c9d1d9" font-weight="600" text-anchor="middle">🔥 kcal · 🕐 timer</text>
