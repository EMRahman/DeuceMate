  <rect x="0.0" y="0.0" width="980.0" height="530.0" rx="10" fill="#14171c"/>
  <text x="32" y="30" font-size="15" fill="#e6edf3" font-weight="600">Vertical budget: where the reminder can go</text>
  <text x="32" y="50" font-size="11.5" fill="#8b949e">Bands are measured 1:1 in points from watchOS simulator screenshots, on the smallest screen the</text>
  <text x="32" y="66" font-size="11.5" fill="#8b949e">watchOS 9 deployment target still reaches: 162×197 pt (40 mm Series 4–6 / SE). The live-match screen</text>
  <text x="32" y="82" font-size="11.5" fill="#8b949e">does not scroll — anything past 197 pt is clipped, and the excess also rides the scoreboard upwards.</text>
  <text x="56" y="110" font-size="12" fill="#8b949e" font-weight="700" letter-spacing="0.6">TODAY</text>
  <text x="56" y="126" font-size="11" fill="#6e7681">· momentum strip, no reminder</text>
  <clipPath id="clip-today"><rect x="56" y="132" width="162" height="197" rx="18"/></clipPath>
  <rect x="56.0" y="132.0" width="162.0" height="197.0" rx="18" fill="#000000" stroke="#30363d" stroke-width="1"/>
  <g clip-path="url(#clip-today)">
