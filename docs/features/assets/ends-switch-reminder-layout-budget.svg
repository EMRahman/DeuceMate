  <text x="806" y="161" font-size="11" fill="#ffffff" font-weight="700" text-anchor="end">15:46</text>
  </g>
  <line x1="646" y1="329" x2="828" y2="329" stroke="#f85149" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="662.0" y="329.0" width="150.0" height="2.5" rx="8" fill="url(#clipped)" stroke="#f85149" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="832" y="341" font-size="10.5" fill="#f85149" font-weight="700">−2 pt</text>
  <text x="56" y="368" font-size="11.5" fill="#8b949e">Everything fits — the calorie/timer</text>
  <text x="56" y="384" font-size="11.5" fill="#6e7681">row is already half off the bottom.</text>
  <text x="356" y="368" font-size="11.5" fill="#f0883e">+29.5 pt of new height. The score</text>
  <text x="356" y="384" font-size="11.5" fill="#8b949e">card rides up under the clock, the</text>
  <text x="356" y="400" font-size="11.5" fill="#8b949e">court/heart-rate row is cut, and the</text>
  <text x="356" y="416" font-size="11.5" fill="#6e7681">calorie/timer row is gone entirely.</text>
  <text x="656" y="368" font-size="11.5" fill="#40CCB5">+0 pt. Pixel-identical to today on</text>
  <text x="656" y="384" font-size="11.5" fill="#8b949e">every size — verified on 40, 42, 46</text>
  <text x="656" y="400" font-size="11.5" fill="#8b949e">and 49 mm; compass-on checked at</text>
  <text x="656" y="416" font-size="11.5" fill="#6e7681">42 mm.</text>
  <line x1="32" y1="488" x2="948" y2="488" stroke="#242a33" stroke-width="1"/>
  <text x="32" y="508" font-size="11" fill="#6e7681">Measured: every screen at 42 mm and below loses the calorie/timer row to the added banner. Hatched = clipped off-screen.</text>
