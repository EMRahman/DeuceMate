<svg xmlns="http://www.w3.org/2000/svg" width="980" height="530" viewBox="0 0 980 530"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="clipped" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#2a1416"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#f85149" stroke-width="2.5"/>
