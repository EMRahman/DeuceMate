  <text x="437.0" y="311.0" font-size="10.5" fill="#c9d1d9" font-weight="600" text-anchor="middle">court + heart rate</text>
  <rect x="362.0" y="337.5" width="150.0" height="9.0" rx="8" fill="#1a1d22" stroke="#3a4250" stroke-width="1"/>
