<!DOCTYPE html>
<!-- Ad 2 — match analysis. One phone, centred and large, because the momentum
     graph is the product's most distinctive image and it needs the pixels.
     Positioned so the chart itself sits in the upper half of the device and the
     filter pills bleed off the bottom edge — a shopper should see the graph,
     not a shrunk-to-fit whole screen. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>DeuceMate — Match analysis</title>
<link rel="stylesheet" href="ad.css">
<style>
  /* Height = width * 2.1727; bottom lands past 1434 so the filter pills
     crop off the edge rather than shrinking the graph to fit. */
  .phone-main {
    width: 480px;                /* -> ~1043px tall, bleeds just past 1434 */
    top: 400px;
    left: 50%;
    transform: translateX(-50%);
  }
</style>
</head>
<body>

  <div class="copy">
    <h1 class="headline">See where the match <span class="accent">turned</span>.</h1>
    <p class="subhead">Every point, with heart rate and steps.</p>
  </div>

  <div class="stage">
    <div class="phone phone-main">
      <img src="src-iphone-graph.png" alt="">
    </div>
  </div>

</body>
</html>
