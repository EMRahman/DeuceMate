# GitHub Pages configuration for the public DeuceMate site.
# Served from the /docs folder on the default branch:
#   index.html   -> marketing landing page  (App Store Marketing URL)
#   try.html     -> interactive browser demo of the Apple Watch scorer
#   support.html -> support / help page      (App Store Support URL)
#   privacy.html -> privacy policy           (App Store Privacy Policy URL)
#   assets/      -> site CSS/JS, the browser-scorer demo, and the app icon
#   screenshots/ -> marketing screenshots shown on the landing page
#
# The internal feature-planning docs under docs/features/ are NOT part of the
# public site and are excluded from the published build.
title: DeuceMate
description: >-
  A reliable, privacy-focused tennis scoring app for Apple Watch with an iPhone
  companion. Support and privacy policy.
exclude:
  - features/
  - features/**
